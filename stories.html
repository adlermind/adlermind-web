<style>
:root {
  --am-rose:   #E8929A;
  --am-sage:   #8FBFB8;
  --am-blue:   #8FAFD4;
  --am-gray:   #4A4A4A;
  --am-pale:   #D8D8DC;
  --am-bg:     #FAFAF8;
  --am-muted:  #6E6763;
  --am-border: #e8e4e0;
  --am-white:  #ffffff;
  --am-dark:   #3d3a36;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; font-weight: 400; color: var(--am-gray); background: var(--am-white); }

nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--am-white); border-bottom: 0.5px solid var(--am-border);
  padding: 0 32px; display: flex; align-items: center; gap: 32px; height: 60px;
}
.nav-logo img { height: 40px; display: block; margin-top: 4px; }
.nav-links { display: flex; align-items: center; gap: 18px; flex: 1; }
.nav-links a { font-size: 13px; color: var(--am-gray); text-decoration: none; transition: color 0.15s; }
.nav-links a:hover, .nav-links a.active { color: var(--am-sage); }
.nav-login-link {
  margin-left: auto; font-size: 13px; color: var(--am-muted);
  text-decoration: none; letter-spacing: 0.04em;
  transition: color 0.15s; white-space: nowrap;
}
.nav-login-link:hover { color: var(--am-sage); }
.nav-login-mobile { display: none; }
.nav-member-btn {
  padding: 7px 18px;
  background: var(--am-sage); color: #fff; border: none; border-radius: 2px;
  font-size: 13px; font-family: 'Noto Sans KR', sans-serif; font-weight: 400;
  cursor: pointer; text-decoration: none; transition: background 0.15s; white-space: nowrap;
}
.nav-member-btn:hover { background: #6fa8a0; }
.nav-ham { display: none; border: none; background: none; cursor: pointer; font-size: 22px; color: var(--am-gray); }

.page-hero {
  background: var(--am-bg); padding: 56px 32px 48px;
  border-bottom: 0.5px solid var(--am-border);
  text-align: center;
}
.page-hero-inner { max-width: 920px; margin: 0 auto; }
.page-label {
  font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 400;
  letter-spacing: 0.22em; color: var(--am-rose); text-transform: uppercase; margin-bottom: 12px;
}
.page-title { font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 400; color: var(--am-gray); }

.page-body { max-width: 1040px; margin: 0 auto; padding: 44px 32px 80px; }

/* ── 글쓰기 안내 줄 (작성자로 지정된 사람에게만 보입니다) ── */
.write-bar { display: none; justify-content: flex-end; margin-bottom: 22px; }
.write-btn {
  font-size: 13px; color: #fff; background: var(--am-sage);
  border: none; border-radius: 2px; padding: 8px 20px;
  text-decoration: none; transition: background 0.15s;
}
.write-btn:hover { background: #6fa8a0; }

/* ── 연재 탭 ── */
.series-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.series-tab {
  padding: 7px 16px; border: 0.5px solid var(--am-border);
  background: var(--am-white); font-size: 13px; color: var(--am-muted);
  cursor: pointer; transition: all 0.15s;
  font-family: 'Noto Sans KR', sans-serif; font-weight: 400;
}
.series-tab:hover { border-color: var(--am-sage); color: var(--am-sage); }
.series-tab.active { background: var(--am-sage); color: #fff; border-color: var(--am-sage); }
.series-note {
  font-size: 13px; line-height: 1.9; color: var(--am-muted);
  border-left: 2px solid var(--am-sage); padding: 4px 0 4px 14px;
  margin-bottom: 22px; word-break: keep-all;
}

/* ── 카드 그리드 ── */
.card-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
}
.story-card {
  display: block; text-decoration: none; color: inherit;
  background: var(--am-white); border: 0.5px solid var(--am-border);
  overflow: hidden; transition: box-shadow 0.22s, transform 0.22s, border-color 0.22s;
}
.story-card:hover {
  transform: translateY(-2px);
  border-color: rgba(143,191,184,0.75);
  box-shadow: 0 6px 20px rgba(74,74,74,0.08);
}
.card-thumb {
  width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
  display: block; background: var(--am-bg);
}
.card-thumb-fallback {
  width: 100%; aspect-ratio: 16 / 10;
  display: flex; align-items: center; justify-content: center;
  background: rgba(143,191,184,0.10);
}
.fallback-mark {
  font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 300;
  letter-spacing: 0.32em; color: rgba(143,191,184,0.85);
}
.card-body { padding: 18px 20px 20px; }
.card-series {
  display: inline-block; font-size: 13px; color: #5a9990;
  background: rgba(143,191,184,0.12); padding: 3px 10px; margin-bottom: 10px;
}
.card-series.card-members { color: #c2727a; background: rgba(232,146,154,0.12); margin-left: 6px; }
.card-title {
  font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 400;
  color: var(--am-gray); line-height: 1.65; word-break: keep-all;
  margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-summary {
  font-size: 13px; line-height: 1.9; color: var(--am-muted); word-break: keep-all;
  margin-bottom: 12px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta {
  font-size: 13px; color: var(--am-muted);
  display: flex; align-items: center; gap: 8px;
  border-top: 0.5px solid var(--am-border); padding-top: 12px;
}
.card-meta .dot { color: var(--am-pale); }
.card-date { font-family: 'Raleway', sans-serif; letter-spacing: 0.04em; }

.list-empty {
  grid-column: 1 / -1; text-align: center; padding: 64px 0 72px;
  font-size: 13px; line-height: 2; color: var(--am-muted);
}
.empty-mark {
  font-family: 'Raleway', sans-serif; font-size: 13px; letter-spacing: 0.32em;
  color: rgba(143,191,184,0.8); margin-bottom: 14px;
}

.more-wrap { text-align: center; padding: 40px 0 0; }
.more-btn {
  font-size: 13px; color: var(--am-sage); background: none;
  border: 0.5px solid var(--am-sage); padding: 9px 28px;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif; font-weight: 400;
  transition: background 0.15s;
}
.more-btn:hover { background: rgba(143,191,184,0.08); }

footer {
  background: var(--am-bg); border-top: 0.5px solid var(--am-border); padding: 48px 32px;
}
.footer-inner { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; }
.footer-logo img { height: 32px; margin-bottom: 10px; }
.footer-info { font-size: 13px; color: var(--am-muted); line-height: 2; }
.footer-nav { display: flex; flex-direction: column; gap: 8px; }
.footer-nav a { font-size: 13px; color: var(--am-muted); text-decoration: none; }
.footer-nav a:hover { color: var(--am-sage); }
.footer-copy { max-width: 900px; margin: 24px auto 0; font-size: 13px; color: var(--am-muted); font-family: 'Raleway', sans-serif; border-top: 0.5px solid var(--am-border); padding-top: 16px; }

@media (max-width: 900px) {
  nav { padding: 0 20px; }
  .nav-links { display: none; }
  .nav-links.open { display: flex; flex-direction: column; position: fixed; top: 60px; left: 0; right: 0; background: var(--am-white); border-bottom: 0.5px solid var(--am-border); padding: 20px; gap: 16px; z-index: 99; }
  .nav-ham { display: block; margin-left: auto; }
  .nav-login-link { display: none; }
  .nav-login-mobile { display: block !important; }
  .page-body { padding: 32px 20px 60px; }
  .page-hero { padding: 40px 20px 32px; }
  .card-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
}
@media (max-width: 560px) {
  .card-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
const SB_URL = 'https://jboceiacgczkqkhqcmqu.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impib2NlaWFjZ2N6a3FraHFjbXF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1OTg1MTYsImV4cCI6MjA5ODE3NDUxNn0.9jHLNB8PVDrWlSc5CDGz5j6ZF9yaKwrnzICvvvsFbvA';
// 로그인한 회원에게는 회원방 글도 보여야 합니다.
// 그래서 고정 anon 키가 아니라 세션이 실린 supabase 클라이언트로 읽습니다.
const client = supabase.createClient(SB_URL, SB_KEY);
window._sbNav = client;

const PAGE_SIZE = 12;
let stories = [];        // 공개된 글 전체
let seriesList = [];     // 연재 목록
let currentSeries = new URLSearchParams(window.location.search).get('series') || '전체';
let shown = 0;

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 대표 그림은 공개 버킷에 있으므로 주소를 그대로 만들어 씁니다.
function coverUrl(path) {
  if (!path) return '';
  return `${SB_URL}/storage/v1/object/public/story-images/${path.split('/').map(encodeURIComponent).join('/')}`;
}

function fmtDate(value) {
  return new Date(value).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
}

async function loadStories() {
  try {
    const [storyRes, seriesRes] = await Promise.all([
      client.from('am_stories')
        .select('id,title,summary,cover_path,author_name,series_id,visibility,published_at,created_at')
        .eq('is_published', true)
        .order('published_at', { ascending: false })
        .order('created_at', { ascending: false }),
      client.from('story_series')
        .select('id,title,description,sort_order')
        .eq('is_active', true)
        .order('sort_order')
    ]);
    stories = storyRes.data || [];
    seriesList = seriesRes.data || [];
  } catch (e) {
    document.getElementById('cardGrid').innerHTML =
      '<div class="list-empty">이야기를 불러오지 못했습니다. 잠시 뒤에 다시 열어 주세요.</div>';
    return;
  }
  renderTabs();
  render();
}

// 글이 하나도 없는 연재는 탭에 세우지 않습니다. 눌러도 빈 화면만 나오기 때문입니다.
function renderTabs() {
  const used = new Set(stories.map(s => s.series_id).filter(Boolean));
  const shownSeries = seriesList.filter(s => used.has(s.id));
  const tabs = document.getElementById('seriesTabs');
  if (!shownSeries.length) { tabs.innerHTML = ''; return; }

  const buttons = [{ id: '전체', title: '전체' }].concat(shownSeries);
  // 연재에 묶이지 않은 낱글이 있으면 그 칸도 세웁니다.
  if (stories.some(s => !s.series_id)) buttons.push({ id: '낱글', title: '그밖의 이야기' });

  tabs.innerHTML = buttons.map(item =>
    `<button class="series-tab${item.id === currentSeries ? ' active' : ''}" data-series="${esc(item.id)}">${esc(item.title)}</button>`
  ).join('');
}

function render() {
  shown = 0;
  const note = document.getElementById('seriesNote');
  const current = seriesList.find(s => s.id === currentSeries);
  if (current && current.description) {
    note.textContent = current.description;
    note.style.display = 'block';
  } else {
    note.style.display = 'none';
  }
  renderMore();
}

function visibleStories() {
  if (currentSeries === '전체') return stories;
  if (currentSeries === '낱글') return stories.filter(s => !s.series_id);
  return stories.filter(s => s.series_id === currentSeries);
}

function cardHtml(story) {
  const thumb = story.cover_path
    ? `<img class="card-thumb" src="${esc(coverUrl(story.cover_path))}" alt="" loading="lazy">`
    : `<div class="card-thumb-fallback"><span class="fallback-mark">ADLER MIND</span></div>`;
  const summary = story.summary
    ? `<div class="card-summary">${esc(story.summary)}</div>`
    : '';
  // 연재 이름은 '전체' 탭에서만 보입니다. 한 연재 안에서는 같은 말이 되풀이될 뿐입니다.
  const series = seriesList.find(s => s.id === story.series_id);
  const seriesTag = (series && currentSeries === '전체')
    ? `<span class="card-series">${esc(series.title)}</span>`
    : '';
  // 회원방 글은 회원에게만 목록에 실립니다. 그 사실을 카드에서 알 수 있게 표시합니다.
  const memberTag = story.visibility === 'members'
    ? `<span class="card-series card-members">회원방</span>`
    : '';
  return `<a class="story-card" href="story.html?id=${encodeURIComponent(story.id)}">
    ${thumb}
    <div class="card-body">
      ${seriesTag}${memberTag}
      <div class="card-title">${esc(story.title)}</div>
      ${summary}
      <div class="card-meta">
        <span>${esc(story.author_name)}</span>
        <span class="dot">·</span>
        <span class="card-date">${fmtDate(story.published_at || story.created_at)}</span>
      </div>
    </div>
  </a>`;
}

function renderMore() {
  const grid = document.getElementById('cardGrid');
  const list = visibleStories();
  if (!list.length) {
    grid.innerHTML = `<div class="list-empty">
      <div class="empty-mark">ADLER MIND</div>
      곧 첫 이야기가 올라옵니다.<br>조금만 기다려 주세요.
    </div>`;
    document.getElementById('moreWrap').style.display = 'none';
    return;
  }
  const next = list.slice(shown, shown + PAGE_SIZE);
  const html = next.map(cardHtml).join('');
  if (shown === 0) grid.innerHTML = html; else grid.insertAdjacentHTML('beforeend', html);
  shown += next.length;
  document.getElementById('moreWrap').style.display = shown < list.length ? 'block' : 'none';
}

document.getElementById('moreBtn').addEventListener('click', renderMore);

// 연재를 고르면 주소에도 남깁니다. 그 연재만 담은 링크를 그대로 보낼 수 있습니다.
document.getElementById('seriesTabs').addEventListener('click', event => {
  const button = event.target.closest('.series-tab');
  if (!button) return;
  currentSeries = button.dataset.series;
  document.querySelectorAll('.series-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.series === currentSeries);
  });
  const url = currentSeries === '전체' ? 'stories.html' : `stories.html?series=${encodeURIComponent(currentSeries)}`;
  history.replaceState({}, '', url);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('navHam').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

loadStories();

// 이야기 작성자로 지정된 계정에게만 글쓰기 단추를 보여 줍니다.
(async () => {
  const client = supabase.createClient(SB_URL, SB_KEY);
  window._sbNav = client;
  const { data: { session } } = await client.auth.getSession();
  if (!session) return;
  const { data: author } = await client
    .from('story_authors')
    .select('user_id')
    .eq('user_id', session.user.id)
    .eq('is_active', true)
    .maybeSingle();
  const { data: admin } = await client
    .from('site_admins')
    .select('user_id')
    .eq('user_id', session.user.id)
    .eq('is_active', true)
    .maybeSingle();
  if (author || admin) document.getElementById('writeBar').style.display = 'flex';
})();
</script>
<script src="site-session.js"></script>
</body>
