<script>

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(v) { return new Date(v).toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }); }
function coverUrl(path) {
  if (!path) return '';
  return `${SB_URL}/storage/v1/object/public/story-images/${path.split('/').map(encodeURIComponent).join('/')}`;
}
function showNotice(text) {
  const el = document.getElementById('notice');
  el.innerHTML = text;
  el.style.display = 'block';
}

// 본문에 HTML 태그가 있으면 소식 게시판과 같은 방식으로 액자(iframe) 안에 그립니다.
// 글쓴이가 붙여넣은 서식이 이 페이지의 글자 크기를 흔들지 않게 하려는 것입니다.
function hasHtmlTag(content) { return /<\/?[a-z][\s\S]*>/i.test(String(content || '')); }
function renderBody(target, content) {
  target.innerHTML = '';
  if (!hasHtmlTag(content)) {
    const plain = document.createElement('div');
    plain.className = 'article-plain';
    plain.textContent = content || '';
    target.appendChild(plain);
    return;
  }
  // 액자는 따로 뜨는 문서라 바깥 페이지의 웹폰트가 따라오지 않습니다.
  // 글쓴이가 고른 '명조'가 시스템 기본 서체로 떨어지지 않게 여기서 한 번 더 불러옵니다.
  const css = `<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; font-size: 15px; line-height: 2; color: #4A4A4A; word-break: keep-all; }
    /* 편집기의 '명조'는 style="font-family: serif" 로 나옵니다. 그것을 우리 명조체로 받습니다.
       'sans-serif' 는 이 문자열을 품지 않으므로 고딕은 그대로 남습니다. */
    [style*="font-family: serif"] { font-family: 'Noto Serif KR', serif; }
    img { max-width: 100%; height: auto; display: block; margin: 14px auto; }
    p { margin: 0 0 14px; }
    h1 { font-size: 20px; margin: 22px 0 10px; font-weight: 400; }
    h2 { font-size: 18px; margin: 20px 0 10px; font-weight: 400; }
    h3 { font-size: 16px; margin: 16px 0 8px; font-weight: 400; }
    ul, ol { padding-left: 20px; margin-bottom: 14px; }
    blockquote { border-left: 2px solid #8FBFB8; padding-left: 14px; color: #6E6763; margin: 14px 0; }
    a { color: #8FAFD4; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 14px; }
    td, th { border: 0.5px solid #e8e4e0; padding: 8px 10px; }
  </style>`;
  const frame = document.createElement('iframe');
  frame.className = 'article-body-frame';
  frame.setAttribute('sandbox', 'allow-same-origin');
  frame.onload = function () {
    try {
      const body = frame.contentDocument && frame.contentDocument.body;
      if (!body) return;
      const fit = () => { frame.style.height = (body.scrollHeight + 24) + 'px'; };
      fit();
      // 사진은 액자가 열린 뒤에 도착합니다. 그때 높이를 다시 재지 않으면 아래가 잘립니다.
      if (window.ResizeObserver) new ResizeObserver(fit).observe(body);
      else body.querySelectorAll('img').forEach(img => {
        if (img.complete) return;
        img.addEventListener('load', fit);
        img.addEventListener('error', fit);
      });
    } catch (e) {}
  };
  frame.srcdoc = css + String(content || '');
  target.appendChild(frame);
}

async function loadStory() {
  if (!storyId) {
    showNotice('글 주소가 올바르지 않습니다.<br><a class="back-link" href="stories.html">목록으로 돌아가기</a>');
    return;
  }
  const { data: story, error } = await client
    .from('am_stories')
    .select('id,title,summary,content,cover_path,author_name,author_user_id,series_id,visibility,is_published,published_at,created_at')
    .eq('id', storyId)
    .maybeSingle();

  if (error || !story) {
    showNotice('글을 찾을 수 없습니다. 지워졌거나 아직 공개하지 않은 글일 수 있습니다.');
    return;
  }

  document.title = `${story.title} · 아들러 이야기 · ADLER MIND 협동조합`;
  document.getElementById('aTitle').textContent = story.title;
  document.getElementById('aAuthor').textContent = story.author_name;
  document.getElementById('aDate').textContent = fmtDate(story.published_at || story.created_at);
  if (!story.is_published) document.getElementById('aDraft').style.display = 'inline-block';
  if (story.visibility === 'members') document.getElementById('aMembers').style.display = 'inline-block';

  if (story.cover_path) {
    const cover = document.getElementById('aCover');
    cover.src = coverUrl(story.cover_path);
    cover.style.display = 'block';
  }
  if (story.summary) {
    const summary = document.getElementById('aSummary');
    summary.textContent = story.summary;
    summary.style.display = 'block';
  }
  renderBody(document.getElementById('aBody'), story.content);

  document.getElementById('aCopy').onclick = () => {
    navigator.clipboard.writeText(`${window.location.origin}/story.html?id=${story.id}`);
    alert('링크가 복사되었습니다.');
  };

  document.getElementById('article').style.display = 'block';

  // 공개하지 않은 글에는 댓글을 받지 않습니다(정책도 같은 기준입니다).
  if (!story.is_published) {
    document.getElementById('commentSection').style.display = 'none';
  } else {
    loadComments();
  }

  showEditLinkIfAllowed(story);
  if (story.series_id) loadSeries(story);
}

// 연재 이름과, 같은 연재의 다른 글을 최대 5편까지 이어 보여 줍니다.
// 책 한 권을 이어 쓰는 자리라 앞뒤 글로 건너가는 길이 있어야 합니다.
async function loadSeries(story) {
  const { data: series } = await client
    .from('story_series').select('id,title').eq('id', story.series_id).maybeSingle();
  if (!series) return;

  const link = document.getElementById('aSeries');
  link.textContent = series.title;
  link.href = `stories.html?series=${encodeURIComponent(series.id)}`;
  link.style.display = 'inline-block';

  const { data: siblings } = await client
    .from('am_stories')
    .select('id,title,published_at,created_at')
    .eq('series_id', series.id)
    .eq('is_published', true)
    .neq('id', story.id)
    .order('published_at', { ascending: false })
    .limit(5);

  if (!siblings || !siblings.length) return;
  document.getElementById('moreHead').textContent = series.title;
  document.getElementById('moreList').innerHTML = siblings.map(row => `
    <a class="more-item" href="story.html?id=${encodeURIComponent(row.id)}">
      <span class="more-title">${esc(row.title)}</span>
      <span class="more-date">${fmtDate(row.published_at || row.created_at)}</span>
    </a>`).join('');
  document.getElementById('moreAll').href = `stories.html?series=${encodeURIComponent(series.id)}`;
  document.getElementById('moreInSeries').style.display = 'block';
}

async function showEditLinkIfAllowed(story) {
  const { data: { session } } = await client.auth.getSession();
  if (!session) return;
  const isAuthor = story.author_user_id && story.author_user_id === session.user.id;
  const { data: admin } = await client
    .from('site_admins').select('user_id')
    .eq('user_id', session.user.id).eq('is_active', true).maybeSingle();
  if (!isAuthor && !admin) return;
  const edit = document.getElementById('aEdit');
  edit.href = `story-write.html?id=${encodeURIComponent(story.id)}`;
  edit.style.display = 'inline-block';
}

async function loadComments() {
  const { data, error } = await client
    .from('story_comments')
    .select('id,created_at,parent_id,author_name,content')
    .eq('story_id', storyId)
    .order('created_at', { ascending: true });
  comments = error ? [] : (data || []);
  renderComments();
}

function commentHtml(row, isReply) {
  return `<div class="comment-item${isReply ? ' reply' : ''}">
    <div class="comment-top">
      <span class="comment-author">${esc(row.author_name)}</span>
      <span class="comment-date">${fmtDate(row.created_at)}</span>
      <span class="comment-tools">
        ${isReply ? '' : `<button class="comment-tool" onclick="openReply('${row.id}')">답글</button>`}
        <button class="comment-tool" onclick="removeComment('${row.id}')">삭제</button>
      </span>
    </div>
    <div class="comment-text">${esc(row.content)}</div>
    <div id="replyBox-${row.id}"></div>
  </div>`;
}

function renderComments() {
  document.getElementById('cCount').textContent = comments.length;
  const list = document.getElementById('commentList');
  if (!comments.length) {
    list.innerHTML = '<div class="comment-empty">첫 댓글을 남겨 주세요.</div>';
    return;
  }
  const roots = comments.filter(c => !c.parent_id);
  list.innerHTML = roots.map(root => {
    const replies = comments.filter(c => c.parent_id === root.id);
    return commentHtml(root, false) + replies.map(r => commentHtml(r, true)).join('');
  }).join('');
}

function openReply(parentId) {
  const box = document.getElementById(`replyBox-${parentId}`);
  if (!box) return;
  if (box.innerHTML) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="comment-form reply-form">
    <div class="form-row">
      <input id="rName-${parentId}" type="text" maxlength="20" placeholder="이름">
      <input id="rPass-${parentId}" type="password" maxlength="30" placeholder="비밀번호 (4자 이상)">
    </div>
    <textarea id="rText-${parentId}" maxlength="1000" placeholder="답글을 적어 주세요."></textarea>
    <div class="form-foot">
      <button class="btn-plain" onclick="openReply('${parentId}')">취소</button>
      <button class="btn-sage" onclick="submitComment('${parentId}')">답글 남기기</button>
    </div>
  </div>`;
}

async function submitComment(parentId) {
  const nameEl = document.getElementById(parentId ? `rName-${parentId}` : 'cName');
  const passEl = document.getElementById(parentId ? `rPass-${parentId}` : 'cPass');
  const textEl = document.getElementById(parentId ? `rText-${parentId}` : 'cText');
  const name = nameEl.value.trim();
  const pass = passEl.value;
  const text = textEl.value.trim();

  if (!name) { alert('이름을 적어 주세요.'); nameEl.focus(); return; }
  if (pass.length < 4) { alert('비밀번호는 4자 이상으로 적어 주세요.'); passEl.focus(); return; }
  if (!text) { alert('댓글 내용을 적어 주세요.'); textEl.focus(); return; }

  const { error } = await client.rpc('add_story_comment', {
    p_story_id: storyId,
    p_parent_id: parentId || null,
    p_author: name,
    p_password: pass,
    p_content: text
  });
  if (error) { alert('댓글을 남기지 못했습니다. ' + (error.message || '')); return; }

  if (parentId) {
    document.getElementById(`replyBox-${parentId}`).innerHTML = '';
  } else {
    passEl.value = '';
    textEl.value = '';
  }
  await loadComments();
}

async function removeComment(id) {
  const pass = prompt('댓글을 쓸 때 적은 비밀번호를 넣어 주세요.');
  if (pass === null) return;
  const { data, error } = await client.rpc('delete_story_comment', { p_id: id, p_password: pass });
  if (error) { alert('지우지 못했습니다. ' + (error.message || '')); return; }
  if (!data) { alert('비밀번호가 맞지 않습니다.'); return; }
  await loadComments();
}

document.getElementById('cSubmit').addEventListener('click', () => submitComment(null));
document.getElementById('navHam').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

loadStory();
</script>
<script src="site-session.js"></script>
</body>
