<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="image/favicon.png">
<link rel="icon" type="image/webp" href="image/favicon.webp">
<title>교육·연수 · ADLER MIND 협동조합</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --am-rose: #E8929A; --am-sage: #8FBFB8; --am-gray: #4A4A4A;
  --am-bg: #FAFAF8; --am-muted: #6E6763; --am-border: #e8e4e0; --am-white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; font-weight: 400; color: var(--am-gray); background: var(--am-white); min-height: 100vh; display: flex; flex-direction: column; }
nav {
  position: sticky; top: 0; z-index: 100; background: var(--am-white);
  border-bottom: 0.5px solid var(--am-border); padding: 0 32px;
  display: flex; align-items: center; gap: 32px; height: 60px;
}
.nav-logo img { height: 40px; display: block; margin-top: 4px; }
.nav-links { display: flex; align-items: center; gap: 18px; flex: 1; }
.nav-links a { font-size: 13px; color: var(--am-gray); text-decoration: none; transition: color 0.15s; }
.nav-links a:hover, .nav-links a.active { color: var(--am-sage); }
.nav-login-link {
  margin-left: auto; font-size: 13px; color: var(--am-muted);
  text-decoration: none; letter-spacing: 0.04em;
  transition: color 0.15s; white-space: nowrap;
}
.nav-login-link:hover { color: var(--am-sage); }
.nav-login-mobile { display: none; }
.nav-member-btn {
  padding: 7px 18px; background: var(--am-sage); color: #fff;
  border: none; border-radius: 2px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
  font-weight: 400; cursor: pointer; text-decoration: none; transition: background 0.15s; white-space: nowrap;
}
.nav-member-btn:hover { background: #6fa8a0; }
.nav-ham { display: none; border: none; background: none; cursor: pointer; font-size: 22px; color: var(--am-gray); }
.coming-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 32px; text-align: center; background: var(--am-bg);
}
.coming-label {
  font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 400;
  letter-spacing: 0.3em; color: var(--am-muted); text-transform: uppercase; margin-bottom: 28px;
}
.coming-line { width: 40px; height: 0.5px; background: var(--am-sage); margin: 0 auto 32px; }
.coming-title {
  font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 400;
  color: var(--am-gray); margin-bottom: 16px;
}
.coming-desc { font-size: 13px; color: var(--am-muted); line-height: 2; margin-bottom: 36px; }
.coming-date {
  font-family: 'Raleway', sans-serif; font-size: 13px; letter-spacing: 0.12em;
  color: var(--am-sage); border: 0.5px solid rgba(143,191,184,0.4);
  padding: 8px 20px; margin-bottom: 32px;
}
.back-link { font-size: 13px; color: var(--am-muted); text-decoration: none; }
.back-link:hover { color: var(--am-sage); }
.hidden { display: none; }
.exp-section { background: var(--am-bg); padding: 64px 32px 40px; }
/* 분야 구역 · 2026-07-28 — 체험 카드 아래에 온다 (상담의 방과 같은 구조) */
.field-section { flex: 1; background: var(--am-bg); padding: 20px 32px 88px; }
.field-inner { max-width: 1000px; margin: 0 auto; }
.field-head { margin-bottom: 30px; }
/* 분야 하나를 열었을 때 체험 구역을 감춥니다. 체험이 없을 때 쓰는 .hidden 과 따로 둡니다. */
.hidden-by-detail { display: none; }
@media (max-width: 900px) { .field-section { padding: 16px 20px 64px; } }
.exp-inner { max-width: 1000px; margin: 0 auto; }
.exp-section-label {
  font-family: 'Raleway', sans-serif; font-size: 13px; font-weight: 400;
  letter-spacing: 0.3em; color: var(--am-muted); text-transform: uppercase;
}
.exp-section-title { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 400; margin: 16px 0 0; }
.exp-section-desc { font-size: 13px; line-height: 2; color: var(--am-muted); margin: 12px 0 30px; }
@media (max-width: 900px) { .exp-section { padding: 44px 20px 60px; } }
@media (max-width: 900px) {
  nav { padding: 0 20px; }
  .nav-links { display: none; }
  .nav-links.open { display: flex; flex-direction: column; position: fixed; top: 60px; left: 0; right: 0; background: var(--am-white); border-bottom: 0.5px solid var(--am-border); padding: 20px; gap: 16px; z-index: 99; }
  .nav-ham { display: block; margin-left: auto; }
  .nav-login-link { display: none; }
  .nav-login-mobile { display: block !important; }
}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html"><img src="image/adlermind_logo.png" alt="ADLER MIND 협동조합"></a>
  <div class="nav-links" id="navLinks">
    <a href="about.html">협동조합 소개</a>
    <a href="counseling.html">심리상담</a>
    <a href="education.html" class="active">교육·연수</a>
    <a href="news.html">소식</a>
    <a href="gallery.html">갤러리</a>
    <a href="contact.html">문의</a>
    <a id="navLoginMobile" class="nav-login-mobile" href="login.html">로그인</a>
  </div>
  <a id="navLoginLink" class="nav-login-link" href="login.html">로그인</a>
  <a class="nav-member-btn" href="members.html">조합원 마당</a>
  <button class="nav-ham" id="navHam">&#9776;</button>
</nav>
<!-- 체험 목록. 관리자 페이지에서 배움의 방으로 걸어 둔 체험이 여기에 나타납니다.
     아직 걸린 체험이 없으면 아래 준비 중 안내가 그대로 보입니다. -->
<section class="exp-section hidden" id="expSection">
  <div class="exp-inner">
    <div class="exp-section-label">EDUCATION</div>
    <h1 class="exp-section-title">배움의 방</h1>
    <p class="exp-section-desc">
      설명 대신 먼저 해보시는 자리입니다. 로그인 없이 해보실 수 있습니다.
    </p>
    <div id="expCards"></div>
  </div>
</section>

<!-- 분야 카드 3장과 분야 상세. 그리는 일은 room-view.js 가 합니다.
     분야마다 파일을 만들지 않고 주소(?field=)로 나눕니다. -->
<section class="field-section" id="fieldSection">
  <div class="field-inner">
    <div class="field-head" id="fieldHead">
      <div class="exp-section-label">EDUCATION</div>
      <h2 class="exp-section-title">어디서 만나든 함께 설계합니다</h2>
      <p class="exp-section-desc">
        학교와 기관, 선생님, 그리고 사람이 모이는 자리마다 필요한 것이 다릅니다.
      </p>
    </div>
    <div id="fieldList"></div>
    <div id="fieldDetail" class="hidden"></div>
  </div>
</section>
<script>
const SB_URL = 'https://jboceiacgczkqkhqcmqu.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impib2NlaWFjZ2N6a3FraHFjbXF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1OTg1MTYsImV4cCI6MjA5ODE3NDUxNn0.9jHLNB8PVDrWlSc5CDGz5j6ZF9yaKwrnzICvvvsFbvA';

document.getElementById('navHam').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

(async () => {
  const _sbNav = supabase.createClient(SB_URL, SB_KEY);
  const { data: { session } } = await _sbNav.auth.getSession();
  if (!session) return;
  const res = await fetch(
    `${SB_URL}/rest/v1/site_users?user_id=eq.${session.user.id}&select=nickname`,
    { headers: { apikey: SB_KEY, Authorization: `Bearer ${session.access_token}` } }
  );
  const [u] = res.ok ? await res.json() : [];
  if (!u) return;
  ['navLoginLink','navLoginMobile'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.textContent = u.nickname + '님의 Life Style'; el.href = 'mypage.html'; }
  });
})();
</script>
<script src="experience-cards.js"></script>
<script>
// 걸린 체험이 없으면 이 구역은 나타나지 않습니다. 분야 카드는 그대로 보입니다.
AMExperienceCards.render({
  into: 'expCards',
  placement: 'education',
  onReady: () => { document.getElementById('expSection').classList.remove('hidden'); }
});
</script>
<script src="education-fields.js"></script>
<script src="room-view.js"></script>
<script>
AMRoom.render({
  listInto: 'fieldList',
  detailInto: 'fieldDetail',
  fields: window.AM_EDUCATION_FIELDS,
  roomName: '배움의 방',
  page: 'education.html',
  // 분야 하나를 열면 체험 카드와 머리글을 감춥니다. 그 이야기에 집중하는 자리입니다.
  onDetail: field => {
    document.getElementById('expSection').classList.toggle('hidden-by-detail', !!field);
    document.getElementById('fieldHead').classList.toggle('hidden', !!field);
    document.title = (field ? field.name + ' · ' : '') + '교육·연수 · ADLER MIND 협동조합';
  }
});
</script>
<script src="site-session.js"></script>
</body>
</html>
